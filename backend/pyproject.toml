[tool.poetry]
name = "gatekeeperai-backend"
version = "0.1.0"
description = "GatekeeperAI secure enterprise app runtime - backend"
authors = ["Jacob Wagner <jacobthomasmichael@gmail.com>"]
python = "^3.12"

[tool.poetry.dependencies]
python = "^3.12"

# Web framework
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.6"}
python-multipart = "^0.0.9"

# Database
sqlalchemy = {extras = ["asyncio"], version = "^2.0.36"}
asyncpg = "^0.29.0"
alembic = "^1.13.2"
psycopg2-binary = "^2.9.9"

# Auth
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}

# Task queue
celery = {extras = ["redis"], version = "^5.4.0"}
redis = "^5.0.8"

# Config
pydantic-settings = "^2.4.0"
python-dotenv = "^1.0.1"

# HTTP client
httpx = "^0.28.1"

# Container runtime
docker = "^7.1.0"

# Encryption
cryptography = "^43.0.1"

# LLM
anthropic = "^0.40.0"

# Rate limiting
slowapi = "^0.1.9"

# Scanners
detect-secrets = "^1.5.0"
pip-audit = "^2.7.3"
presidio-analyzer = "^2.2.355"
spacy = "^3.7.5"
sendgrid = "^6.11.0"

[tool.poetry.dev-dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.23.8"
pytest-cov = "^5.0.0"
fakeredis = "^2.35.1"
factory-boy = "^3.3.1"
because-py = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
