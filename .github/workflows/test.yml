name: Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gatekeeper
          POSTGRES_PASSWORD: gatekeeper_dev
          POSTGRES_DB: gatekeeperai_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio anyio httpx psycopg2-binary because-py

      - name: Run tests
        env:
          RATELIMIT_ENABLED: "0"
          DATABASE_URL: "postgresql+asyncpg://gatekeeper:gatekeeper_dev@localhost:5433/gatekeeperai_test"
          REDIS_URL: "redis://localhost:6379/0"
          SECRET_KEY: "ci-test-secret-key-not-for-production"
          SECRET_ENCRYPTION_KEY: "Y2ktdGVzdC1lbmNyeXB0aW9uLWtleS0zMmNoYXJz"
          ANTHROPIC_API_KEY: "sk-ant-ci-placeholder"
        run: python -m pytest tests/ -v --ignore=tests/test_setup.py -x

      - name: Run setup tests in isolation
        env:
          RATELIMIT_ENABLED: "0"
          DATABASE_URL: "postgresql+asyncpg://gatekeeper:gatekeeper_dev@localhost:5433/gatekeeperai_test"
          REDIS_URL: "redis://localhost:6379/0"
          SECRET_KEY: "ci-test-secret-key-not-for-production"
          SECRET_ENCRYPTION_KEY: "Y2ktdGVzdC1lbmNyeXB0aW9uLWtleS0zMmNoYXJz"
          ANTHROPIC_API_KEY: "sk-ant-ci-placeholder"
        run: python -m pytest tests/test_setup.py -v

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost/api/v1"
        run: npm run build
