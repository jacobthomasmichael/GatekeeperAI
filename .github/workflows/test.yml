name: Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gatekeeper
          POSTGRES_PASSWORD: gatekeeper_dev
          POSTGRES_DB: gatekeeperai_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio anyio httpx psycopg2-binary because-py

      - name: Run tests
        env:
          RATELIMIT_ENABLED: "0"
        run: python -m pytest tests/ -v --ignore=tests/test_setup.py -x

      - name: Run setup tests in isolation
        env:
          RATELIMIT_ENABLED: "0"
        run: python -m pytest tests/test_setup.py -v
