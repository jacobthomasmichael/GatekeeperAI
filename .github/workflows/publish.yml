name: Publish Docker images

on:
  push:
    branches: [main]
  release:
    types: [published]

env:
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/gatekeeperai-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/gatekeeperai-frontend
  GIT_SERVICE_IMAGE: ghcr.io/${{ github.repository_owner }}/gatekeeperai-git-service

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata — backend
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata — frontend
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata — git-service
        id: git-service-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GIT_SERVICE_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push git-service
        uses: docker/build-push-action@v5
        with:
          context: ./infra/git-service
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.git-service-meta.outputs.tags }}
          labels: ${{ steps.git-service-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
