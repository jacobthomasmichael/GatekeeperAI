name: Publish Docker images

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

env:
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/gatekeeperai-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/gatekeeperai-frontend
  GIT_SERVICE_IMAGE: ghcr.io/${{ github.repository_owner }}/gatekeeperai-git-service

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── ECR login (skipped when ECR_REGISTRY secret is not set) ──────────────
      # secrets context is not available in step if: conditions — use a run step
      # to detect configuration and gate subsequent steps on its output.
      - name: Check ECR configuration
        id: ecr
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
        run: |
          if [ -n "$ECR_REGISTRY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials for ECR
        if: steps.ecr.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Log in to ECR
        if: steps.ecr.outputs.configured == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build image lists — append ECR paths when ECR_REGISTRY is configured
      - name: Compute image lists
        id: imgs
        env:
          ECR: ${{ secrets.ECR_REGISTRY }}
        run: |
          backend="${{ env.BACKEND_IMAGE }}"
          frontend="${{ env.FRONTEND_IMAGE }}"
          git_svc="${{ env.GIT_SERVICE_IMAGE }}"
          if [ -n "$ECR" ]; then
            backend="$backend"$'\n'"$ECR/gatekeeperai/backend"
            frontend="$frontend"$'\n'"$ECR/gatekeeperai/frontend"
            git_svc="$git_svc"$'\n'"$ECR/gatekeeperai/git-service"
          fi
          printf 'backend<<EOF\n%s\nEOF\n' "$backend" >> "$GITHUB_OUTPUT"
          printf 'frontend<<EOF\n%s\nEOF\n' "$frontend" >> "$GITHUB_OUTPUT"
          printf 'git_svc<<EOF\n%s\nEOF\n' "$git_svc" >> "$GITHUB_OUTPUT"

      # ── Backend ───────────────────────────────────────────────────────────────

      - name: Extract metadata — backend
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.imgs.outputs.backend }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Frontend ──────────────────────────────────────────────────────────────

      - name: Extract metadata — frontend
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.imgs.outputs.frontend }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Git service ───────────────────────────────────────────────────────────

      - name: Extract metadata — git-service
        id: git-service-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.imgs.outputs.git_svc }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push git-service
        uses: docker/build-push-action@v5
        with:
          context: ./infra/git-service
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.git-service-meta.outputs.tags }}
          labels: ${{ steps.git-service-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
