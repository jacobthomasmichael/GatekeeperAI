apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gatekeeperai.fullname" . }}-worker-deploy
  labels:
    {{- include "gatekeeperai.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker-deploy
spec:
  replicas: {{ .Values.replicas.workerDeploy }}
  selector:
    matchLabels:
      {{- include "gatekeeperai.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker-deploy
  template:
    metadata:
      labels:
        {{- include "gatekeeperai.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker-deploy
    spec:
      # IRSA ServiceAccount — same role as the scan worker (needs ECR + S3 + EKS access)
      serviceAccountName: {{ include "gatekeeperai.fullname" . }}-worker
      containers:
        - name: worker-deploy
          image: {{ include "gatekeeperai.image" (dict "registry" .Values.image.registry "name" "gatekeeperai/backend" "tag" .Values.image.tag) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - celery
            - -A
            - worker.celery_app.celery_app
            - worker
            - --loglevel=info
            - --queues=deploys
            - --concurrency=2
          env:
            {{- include "gatekeeperai.backendEnv" . | nindent 12 }}
            - name: BUILD_CONTEXT_BUCKET
              value: {{ .Values.aws.buildContextBucket | quote }}
            - name: ECR_REGISTRY
              value: {{ .Values.aws.ecrRegistry | quote }}
          volumeMounts:
            - name: git-repos
              mountPath: /git-repos
            - name: nginx-apps
              mountPath: /nginx-apps
          resources:
            {{- toYaml .Values.resources.worker | nindent 12 }}
      volumes:
        - name: git-repos
          persistentVolumeClaim:
            claimName: {{ include "gatekeeperai.fullname" . }}-git-repos
        - name: nginx-apps
          persistentVolumeClaim:
            claimName: {{ include "gatekeeperai.fullname" . }}-nginx-apps
