apiVersion: v1
kind: Service
metadata:
  name: {{ include "gatekeeperai.fullname" . }}-git
  labels:
    {{- include "gatekeeperai.labels" . | nindent 4 }}
    app.kubernetes.io/component: git
  annotations:
    # Provision an AWS Network Load Balancer (Layer 4) for SSH traffic.
    # NLB is required here — ALB does not support TCP/SSH.
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    # Route traffic to instance (node port) rather than IP — more compatible
    # with older EKS setups that don't have the VPC CNI in IP target mode.
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: instance
spec:
  type: LoadBalancer
  selector:
    {{- include "gatekeeperai.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: git
  ports:
    - name: ssh
      port: 2222
      targetPort: ssh
      protocol: TCP
