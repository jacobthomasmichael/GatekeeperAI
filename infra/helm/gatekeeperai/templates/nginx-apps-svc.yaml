apiVersion: v1
kind: Service
metadata:
  name: {{ include "gatekeeperai.fullname" . }}-nginx-apps
  labels:
    {{- include "gatekeeperai.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx-apps
spec:
  type: ClusterIP
  selector:
    {{- include "gatekeeperai.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: nginx-apps
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
