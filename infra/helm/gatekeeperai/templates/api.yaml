apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gatekeeperai.fullname" . }}-api
  labels:
    {{- include "gatekeeperai.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.autoscaling.api.enabled }}
  replicas: {{ .Values.replicas.api }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "gatekeeperai.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "gatekeeperai.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      initContainers:
        # Run database migrations before the api pod comes up.
        # Uses the same image so the Alembic version always matches the code.
        - name: migrate
          image: {{ include "gatekeeperai.image" (dict "registry" .Values.image.registry "name" "gatekeeperai/backend" "tag" .Values.image.tag) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          env:
            {{- include "gatekeeperai.backendEnv" . | nindent 12 }}
      containers:
        - name: api
          image: {{ include "gatekeeperai.image" (dict "registry" .Values.image.registry "name" "gatekeeperai/backend" "tag" .Values.image.tag) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            {{- include "gatekeeperai.backendEnv" . | nindent 12 }}
          volumeMounts:
            - name: git-repos
              mountPath: /git-repos
            - name: nginx-apps
              mountPath: /nginx-apps
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: git-repos
          persistentVolumeClaim:
            claimName: {{ include "gatekeeperai.fullname" . }}-git-repos
        - name: nginx-apps
          persistentVolumeClaim:
            claimName: {{ include "gatekeeperai.fullname" . }}-nginx-apps
