apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "gatekeeperai.fullname" . }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gatekeeperai.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "gatekeeperai.fullname" . }}-worker
subjects:
  - kind: ServiceAccount
    name: {{ include "gatekeeperai.fullname" . }}-worker
    namespace: {{ .Release.Namespace }}
