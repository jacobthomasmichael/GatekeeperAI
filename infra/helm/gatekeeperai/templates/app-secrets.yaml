apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gatekeeperai.fullname" . }}-secrets
  labels:
    {{- include "gatekeeperai.labels" . | nindent 4 }}
  annotations:
    # In production, replace this Secret with an ExternalSecret resource synced
    # from AWS Secrets Manager using the External Secrets Operator:
    #   https://external-secrets.io/latest/provider/aws-secrets-manager/
    # Setting secrets via Helm values stores them in the Helm release secret
    # (base64 in etcd). Use ESO or Sealed Secrets for production hardening.
type: Opaque
stringData:
  secret-key: {{ .Values.secrets.secretKey | quote }}
  secret-encryption-key: {{ .Values.secrets.secretEncryptionKey | quote }}
  anthropic-api-key: {{ .Values.secrets.anthropicApiKey | quote }}
  database-url: {{ .Values.secrets.databaseUrl | quote }}
  redis-url: {{ .Values.secrets.redisUrl | quote }}
