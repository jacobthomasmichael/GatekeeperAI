# Base nginx configuration for the nginx-apps pod.
# Per-app location blocks are written to /etc/nginx/conf.d/ by the worker's
# nginx_service.py and land on the shared EFS volume (nginx-apps PVC).
# The inotifywait sidecar in nginx-apps.yaml triggers `nginx -s reload`
# whenever files in conf.d change.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gatekeeperai.fullname" . }}-nginx-apps-config
  labels:
    {{- include "gatekeeperai.labels" . | nindent 4 }}
data:
  nginx.conf: |
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /tmp/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent"';

        access_log /var/log/nginx/access.log main;

        sendfile       on;
        keepalive_timeout 65;

        # The API service for auth_request callbacks
        upstream gatekeeper_api {
            server {{ include "gatekeeperai.fullname" . }}-api:8000;
        }

        server {
            listen 80;
            server_name _;

            # Named location for auth redirect — per-app conf blocks reference this
            location @app_login_redirect {
                return 302 /login?next=$request_uri;
            }

            # Per-app proxy configs written by the worker (on the EFS volume)
            include /etc/nginx/conf.d/*.conf;

            # Health check endpoint for Kubernetes liveness/readiness probes
            location /nginx-health {
                access_log off;
                return 200 "ok\n";
                add_header Content-Type text/plain;
            }
        }
    }
