apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gatekeeperai.fullname" . }}-worker
  labels:
    {{- include "gatekeeperai.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.worker.irsaRoleArn }}
    # IRSA annotation — binds this ServiceAccount to the IAM role created by
    # Terraform (infra/terraform/main.tf → aws_iam_role.worker_irsa).
    # The EKS OIDC provider exchanges the pod's projected token for AWS
    # credentials scoped to this role.
    eks.amazonaws.com/role-arn: {{ .Values.worker.irsaRoleArn | quote }}
    {{- end }}
