{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "gatekeeperai.fullname" . }}
  labels:
    {{- include "gatekeeperai.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.ingress.tls }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer | quote }}
    {{- end }}
    # Increase proxy body size for zip uploads (apps can be large)
    nginx.ingress.kubernetes.io/proxy-body-size: "512m"
    # Increase timeout for scan SSE streams and slow builds
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    # Enable WebSocket upgrades (needed for Next.js HMR and some Streamlit apps)
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  {{- if and .Values.ingress.tls .Values.ingress.hostname }}
  tls:
    - hosts:
        - {{ .Values.ingress.hostname | quote }}
      secretName: {{ include "gatekeeperai.fullname" . }}-tls
  {{- end }}
  rules:
    - {{- if .Values.ingress.hostname }}
      host: {{ .Values.ingress.hostname | quote }}
      {{- end }}
      http:
        paths:
          # API — must come before / to take priority
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: {{ include "gatekeeperai.fullname" . }}-api
                port:
                  name: http
          # Deployed apps served by nginx-apps pod
          - path: /apps/
            pathType: Prefix
            backend:
              service:
                name: {{ include "gatekeeperai.fullname" . }}-nginx-apps
                port:
                  name: http
          # Frontend — catch-all
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "gatekeeperai.fullname" . }}-frontend
                port:
                  name: http
{{- end }}
