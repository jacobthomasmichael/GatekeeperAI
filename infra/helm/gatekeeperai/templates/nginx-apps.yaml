apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gatekeeperai.fullname" . }}-nginx-apps
  labels:
    {{- include "gatekeeperai.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "gatekeeperai.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: nginx-apps
  template:
    metadata:
      labels:
        {{- include "gatekeeperai.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: nginx-apps
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            # Per-app .conf files written by the worker land here (EFS volume).
            # The inotifywait sidecar watches this directory for changes.
            - name: nginx-apps
              mountPath: /etc/nginx/conf.d
            # Deployed app static files / reverse-proxy targets also served
            # from the git-repos volume when nginx_service.py writes static configs
            - name: git-repos
              mountPath: /git-repos
              readOnly: true
          resources:
            {{- toYaml .Values.resources.nginxApps | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

        # Sidecar: watches the conf.d directory and reloads nginx when files change.
        # Requires inotify-tools to be available in the nginx:alpine image;
        # if not, build a custom image or use an initContainer to install it.
        - name: nginx-reloader
          image: nginx:alpine
          command:
            - sh
            - -c
            - |
              apk add --no-cache inotify-tools
              echo "nginx-reloader: watching /etc/nginx/conf.d for changes..."
              while inotifywait -e modify,create,delete /etc/nginx/conf.d/; do
                echo "nginx-reloader: change detected, reloading nginx..."
                nginx -s reload
              done
          volumeMounts:
            - name: nginx-apps
              mountPath: /etc/nginx/conf.d
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi

      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "gatekeeperai.fullname" . }}-nginx-apps-config
        - name: nginx-apps
          persistentVolumeClaim:
            claimName: {{ include "gatekeeperai.fullname" . }}-nginx-apps
        - name: git-repos
          persistentVolumeClaim:
            claimName: {{ include "gatekeeperai.fullname" . }}-git-repos
