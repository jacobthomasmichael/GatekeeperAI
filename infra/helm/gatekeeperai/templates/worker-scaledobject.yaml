{{- if .Values.keda.enabled }}
{{- if .Values.keda.worker.redisPasswordSecretName }}
---
# TriggerAuthentication: supplies Redis AUTH token from a K8s Secret.
# Required for ElastiCache deployments that use transit encryption + AUTH.
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ include "gatekeeperai.fullname" . }}-redis-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gatekeeperai.labels" . | nindent 4 }}
spec:
  secretTargetRef:
    - parameter: password
      name: {{ .Values.keda.worker.redisPasswordSecretName }}
      key: password
{{- end }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "gatekeeperai.fullname" . }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gatekeeperai.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "gatekeeperai.fullname" . }}-worker
  minReplicaCount: {{ .Values.keda.worker.minReplicas }}
  maxReplicaCount: {{ .Values.keda.worker.maxReplicas }}
  cooldownPeriod: 60
  triggers:
  - type: redis
    {{- if .Values.keda.worker.redisPasswordSecretName }}
    authenticationRef:
      name: {{ include "gatekeeperai.fullname" . }}-redis-auth
    {{- end }}
    metadata:
      address: {{ .Values.keda.worker.redisAddress }}
      listName: celery
      listLength: "{{ .Values.keda.worker.listLength }}"
      enableTLS: "false"
{{- end }}
