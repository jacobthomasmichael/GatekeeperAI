# Local/dev HTTP entry point — no TLS, no domain required.
#
# default.conf.template (one directory up) is the production reference used
# by GatekeeperControl when provisioning a real EC2 host with a domain and
# Let's Encrypt certs; it's HTTPS-only and isn't wired into this repo's local
# docker-compose mount at all. Without this file, `docker compose --profile
# production up` starts nginx but nothing listens on plain HTTP, so deployed
# app URLs (http://localhost/apps/{name}/) 404 for anyone testing locally.
#
# This file provides the same routing (frontend, API, per-app auth_request
# gating) over plain HTTP so the full submit -> scan -> deploy -> open-app
# loop is actually testable on a local machine. Production/EC2 installs via
# GatekeeperControl should continue to rely on default.conf.template's
# HTTPS block, not this file.

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    resolver 127.0.0.11 valid=10s;

    # Frontend — resolved at request time (not config-load time) via the
    # variable + resolver combo, so nginx still starts even when the
    # frontend container isn't running (e.g. running it locally via
    # `npm run dev` for hot reload instead of the Docker Compose service —
    # host.docker.internal reaches the host's dev server in that case).
    location / {
        set $frontend_upstream host.docker.internal:3000;
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API — resolved at request time (see note on the frontend location
    # above); static proxy_pass caches the container's IP at nginx startup,
    # which goes stale the moment `docker compose up` recreates the api
    # container (e.g. after a rebuild), causing 502s until nginx restarts.
    location /api/ {
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Named location for app auth redirects (used by per-app location blocks)
    location @app_login_redirect {
        return 302 /login?next=$request_uri;
    }

    # Per-app proxy configs are written here by the deploy pipeline
    include /etc/nginx/conf.d/apps/*.conf;
}
